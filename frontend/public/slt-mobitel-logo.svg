<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" fill="none" className="slt-mobitel-logo">
  <!-- SLT-MOBITEL Connection Mark (Slanted Signal Bars) -->
  <g id="slt-signal-mark">
    <!-- Top Left Cyan Bar -->
    <path d="M22 6 L6 30" stroke="#00A9E0" stroke-width="7" stroke-linecap="round" />
    <!-- Bottom Left Deep Blue Bar -->
    <path d="M22 28 L6 52" stroke="#0057A8" stroke-width="7" stroke-linecap="round" />
    <!-- Center Green Dot -->
    <circle cx="28" cy="30" r="4.5" fill="#00A651" />
    <!-- Right Green Bar -->
    <path d="M46 22 L30 52" stroke="#00A651" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Wordmark "SLT" in Deep Blue & "MOBITEL" in Vibrant Green -->
  <!-- SLT -->
  <text x="58" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#0057A8">SLT</text>
  <!-- MOBITEL -->
  <text x="124" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#00A651">MOBITEL</text>

  <!-- Slogan "The Connection" -->
  <text x="160" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#0057A8">The Connection</text>
</svg>
